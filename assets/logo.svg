<svg xmlns="http://www.w3.org/2000/svg" width="248" height="34" viewBox="0 0 248 34" role="img" aria-label="Sharanjeet Singh — AI Systems">
  <!-- The previous logo drew #111 text on the site's dark background, so it was
       effectively invisible, and the two text runs overlapped. -->
  <defs>
    <linearGradient id="logoAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
  </defs>
  <text x="0" y="22"
        font-family="'Space Grotesk', 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="19" font-weight="700" letter-spacing="-0.4" fill="#f1f5f9">Sharanjeet Singh</text>
  <circle cx="157" cy="16" r="3" fill="url(#logoAccent)" />
  <text x="168" y="22"
        font-family="'Space Grotesk', 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="12.5" font-weight="500" letter-spacing="0.2" fill="#94a3b8">AI Systems</text>
</svg>
